<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<title>YAZU CTF — Challenge Library</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2334d399'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='monospace' font-size='38' font-weight='700' fill='%230b0f14'%3EY%3C/text%3E%3C/svg%3E" />
</head>
<body>

<!-- ═══════════════ LIBRARY VIEW ═══════════════ -->
<div id="library-view" class="view">
  <header class="lib-header">
    <h1 class="lib-title">Challenge Library</h1>
    <div class="lib-header-right">
      <span class="lib-score">Score: <span id="lib-score">0</span> / <span id="lib-total">0</span></span>
      <input id="player" class="player-input" value="guest" spellcheck="false" maxlength="24" />
      <button id="newgame" class="btn-secondary">New Game</button>
      <button id="reset" class="btn-danger">Reset</button>
    </div>
  </header>

  <section class="progress-panel" id="progress-panel">
    <button class="progress-toggle" id="progress-toggle">
      <span class="progress-toggle-label">Progress Tracker</span>
      <span class="progress-chevron" id="progress-chevron">▾</span>
    </button>
    <div class="progress-body" id="progress-body">
      <div class="progress-row">
        <div class="progress-stat">
          <div class="progress-stat-num" id="stat-solved">0</div>
          <div class="progress-stat-label">Solved</div>
        </div>
        <div class="progress-stat">
          <div class="progress-stat-num" id="stat-total">0</div>
          <div class="progress-stat-label">Challenges</div>
        </div>
        <div class="progress-stat">
          <div class="progress-stat-num" id="stat-score">0</div>
          <div class="progress-stat-label">Points</div>
        </div>
        <div class="progress-stat">
          <div class="progress-stat-num" id="stat-pct">0%</div>
          <div class="progress-stat-label">Complete</div>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
      <div class="progress-per-cat" id="progress-per-cat"></div>
    </div>
  </section>

  <section class="filters">
    <div class="filters-row">
      <input id="filter-search" class="filter-search" type="text" placeholder="Search challenges..." />
      <select id="filter-category" class="filter-select">
        <option value="">All categories</option>
      </select>
      <select id="filter-difficulty" class="filter-select">
        <option value="">All levels</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
      </select>
      <select id="filter-status" class="filter-select">
        <option value="">All statuses</option>
        <option value="solved">Solved</option>
        <option value="unsolved">Unsolved</option>
      </select>
    </div>
    <div class="filters-row toggles">
      <label class="toggle">
        <input type="checkbox" id="toggle-hide-solved" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Hide Solved</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggle-only-easy" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Only Easy</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggle-only-medium" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Only Medium</span>
      </label>
      <button id="filter-clear" class="btn-ghost">Clear filters</button>
    </div>
  </section>

  <section class="challenge-grid" id="challenge-grid"></section>

  <div class="no-results" id="no-results" hidden>No challenges match your filters.</div>

  <footer class="footer">
    <div class="footer-left">YAZU CTF</div>
    <div class="footer-right">Client-side · No tracking · No accounts · Progress saved locally</div>
  </footer>
</div>

<!-- ═══════════════ CHALLENGE VIEW ═══════════════ -->
<div id="challenge-view" class="view" hidden>
  <header class="chal-header">
    <button id="back-to-library" class="btn-back">← Challenge Library</button>
    <div class="chal-header-right">
      <span class="lib-score">Score: <span id="chal-score">0</span> / <span id="chal-total">0</span></span>
      <input id="player-chal" class="player-input" value="guest" spellcheck="false" maxlength="24" />
      <button id="newgame-chal" class="btn-secondary">New Game</button>
      <button id="reset-chal" class="btn-danger">Reset</button>
    </div>
  </header>

  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <main class="chal-main">
    <section class="challenge-header">
      <div class="challenge-title-row">
        <h2 id="ch-title">—</h2>
        <span id="ch-cat" class="badge"></span>
        <span id="ch-diff" class="badge diff-badge"></span>
        <span id="ch-pts" class="badge badge-pts"></span>
      </div>
      <p id="ch-desc" class="challenge-desc"></p>
    </section>

    <section class="chal-preview" id="chal-preview" hidden>
      <div class="chal-preview-header">
        <span class="chal-preview-label">Asset</span>
        <span class="chal-preview-filename" id="chal-preview-filename"></span>
      </div>
      <div class="chal-preview-body">
        <img id="chal-preview-img" alt="challenge asset" />
      </div>
    </section>

    <div class="panes">
      <div class="pane-tabs" id="pane-tabs" hidden>
        <button class="pane-tab active" data-pane="terminal">Terminal</button>
        <button class="pane-tab" data-pane="browser">Browser</button>
      </div>

      <section class="terminal" id="terminal-panel">
        <div class="terminal-output" id="terminal-output"></div>
        <div class="terminal-input-row">
          <span class="prompt">$</span>
          <input id="terminal-input" class="terminal-input" autocomplete="off"
                 autocapitalize="off" spellcheck="false" placeholder="type a command…" maxlength="500" />
        </div>
      </section>

      <section class="browser" id="browser-panel" hidden>
        <div class="browser-toolbar">
          <button class="browser-btn" id="browser-back" title="Back" disabled>◀</button>
          <button class="browser-btn" id="browser-forward" title="Forward" disabled>▶</button>
          <button class="browser-btn" id="browser-reload" title="Reload">⟳</button>
          <input class="browser-url" id="browser-url" spellcheck="false"
                 placeholder="http://target/" autocomplete="off" autocapitalize="off" maxlength="2000" />
          <button class="browser-btn browser-go" id="browser-go">Go</button>
        </div>
        <div class="browser-viewport" id="browser-viewport"></div>
      </section>
    </div>

    <div class="quick-actions" id="quick-actions"></div>

    <section class="flag-row" id="flag-row"></section>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="md5.js"></script>
<script src="challenges.js"></script>
<script src="app.js"></script>
</body>
</html>
